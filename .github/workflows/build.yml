# CI build: every PR and manual run compiles and packages the plugin. Docs-only changes skip
# the heavy build.
name: Build

on:
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

# One in-flight build per PR or ref; a new push cancels the previous run.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-reusable.yml
    # No secrets are passed, so fork PRs build in a zero-secret context.
