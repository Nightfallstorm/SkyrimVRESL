name: clang-format

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      # Check only: failing here tells the author to run clang-format, rather than the
      # workflow pushing commits to the PR branch.
      - uses: DoozyX/clang-format-lint-action@v0.16
        with:
          source: "."
          exclude: "external extern include"
          extensions: "h,cpp,c"
          clangFormatVersion: 16
